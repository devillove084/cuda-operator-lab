<svg width="640" height="230" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:20px auto;">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#999"/>
    </marker>
  </defs>
  <rect width="640" height="230" fill="#222" rx="8"/>

  <text x="140" y="24" fill="#ccc" font-family="monospace" font-size="13" text-anchor="middle">x, dy  (N &#215; C), mean, rstd (N)</text>
  <rect x="40" y="36" width="200" height="140" fill="#1a3a5c" stroke="#3a6a9c" rx="3"/>
  <line x1="40" y1="64" x2="240" y2="64" stroke="#3a6a9c"/>
  <line x1="40" y1="92" x2="240" y2="92" stroke="#3a6a9c"/>
  <line x1="40" y1="120" x2="240" y2="120" stroke="#3a6a9c"/>
  <line x1="40" y1="148" x2="240" y2="148" stroke="#3a6a9c"/>
  <rect x="40" y="64" width="200" height="28" fill="#2d5a27" opacity="0.8"/>
  <text x="140" y="83" fill="#ddd" font-family="monospace" font-size="12" text-anchor="middle">row i</text>
  <rect x="160" y="36" width="24" height="140" fill="#7a4a1a" opacity="0.7"/>
  <text x="172" y="194" fill="#e3b07e" font-family="monospace" font-size="12" text-anchor="middle">col j</text>

  <line x1="240" y1="78" x2="360" y2="78" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="300" y="70" fill="#aaa" font-family="monospace" font-size="11" text-anchor="middle">reduce over C</text>
  <rect x="362" y="58" width="250" height="40" fill="#2d5a27" rx="4"/>
  <text x="487" y="76" fill="#ddd" font-family="monospace" font-size="12" text-anchor="middle">mean_j(g), mean_j(g&#183;x&#770;)</text>
  <text x="487" y="91" fill="#ddd" font-family="monospace" font-size="12" text-anchor="middle">&#8594; dx[i, :]</text>

  <line x1="184" y1="176" x2="360" y2="176" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="290" y="168" fill="#aaa" font-family="monospace" font-size="11" text-anchor="middle">reduce over N</text>
  <rect x="362" y="146" width="250" height="52" fill="#7a4a1a" rx="4"/>
  <text x="487" y="166" fill="#ddd" font-family="monospace" font-size="12" text-anchor="middle">dgamma[j] = &#931;_i dy&#183;x&#770;</text>
  <text x="487" y="186" fill="#ddd" font-family="monospace" font-size="12" text-anchor="middle">dbeta[j] = &#931;_i dy</text>
  <text x="320" y="218" fill="#999" font-family="monospace" font-size="11" text-anchor="middle">dx needs row reductions; dgamma and dbeta reduce down columns</text>
</svg>
