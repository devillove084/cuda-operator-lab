<svg width="620" height="230" viewBox="0 0 620 230" xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:20px auto; font-family:monospace;">
  <rect width="620" height="230" fill="#222" rx="8"/>
  <text x="16" y="22" fill="#ccc" font-size="11" font-weight="bold">One token row i (K features) against output channel j</text>
  <g font-size="10" text-anchor="middle">
    <rect x="20" y="70" width="70" height="24" rx="3" fill="#2a3a4a" stroke="#4a8abf"/><text x="55" y="86" fill="#4a8abf">x[i] fp32</text>
    <rect x="115" y="70" width="110" height="24" rx="3" fill="#2a4a38" stroke="#52b788"/><text x="170" y="86" fill="#52b788">RMSNorm &#215; gamma</text>
    <rect x="250" y="70" width="120" height="24" rx="3" fill="#4a3a2a" stroke="#ffcc66"/><text x="310" y="86" fill="#ffcc66">q[i] int8, s[i]</text>
    <rect x="250" y="130" width="120" height="24" rx="3" fill="#2a3a4a" stroke="#4a8abf"/><text x="310" y="146" fill="#4a8abf">W[j] int8, w_scale[j]</text>
    <rect x="395" y="100" width="90" height="24" rx="3" fill="#4a3a2a" stroke="#ffcc66"/><text x="440" y="116" fill="#ffcc66">int32 dot</text>
    <rect x="510" y="100" width="95" height="24" rx="3" fill="#4a2a3a" stroke="#e07a9a"/><text x="557" y="116" fill="#e07a9a">&#215; s[i] w_scale[j]</text>
  </g>
  <g stroke="#888" stroke-width="1.2" fill="none">
    <line x1="90" y1="82" x2="113" y2="82"/><line x1="225" y1="82" x2="248" y2="82"/>
    <line x1="370" y1="82" x2="393" y2="108"/><line x1="370" y1="142" x2="393" y2="116"/>
    <line x1="485" y1="112" x2="508" y2="112"/>
  </g>
  <text x="16" y="182" fill="#ffcc66" font-size="10">s[i] = max_k |y[i, k]| / 127, q[i, k] = round(y[i, k] / s[i]) in [-127, 127]</text>
  <text x="16" y="204" fill="#ffcc66" font-size="10">W has shape (N, K): row j holds the K weights of output channel j</text>
</svg>
