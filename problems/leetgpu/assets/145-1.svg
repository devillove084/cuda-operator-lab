<svg width="620" height="250" viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:20px auto; font-family:monospace;">
  <rect width="620" height="250" fill="#222" rx="8"/>
  <text x="16" y="22" fill="#ccc" font-size="11" font-weight="bold">One sequence: context_len = 8, q_len = 3 (chunk = last 3 tokens)</text>

  <text x="16" y="50" fill="#888" font-size="10">KV positions</text>
  <g font-size="10" text-anchor="middle">
    <rect x="120" y="36" width="36" height="22" rx="3" fill="#2a3a4a" stroke="#4a8abf"/><text x="138" y="51" fill="#4a8abf">0</text>
    <rect x="158" y="36" width="36" height="22" rx="3" fill="#2a3a4a" stroke="#4a8abf"/><text x="176" y="51" fill="#4a8abf">1</text>
    <rect x="196" y="36" width="36" height="22" rx="3" fill="#2a3a4a" stroke="#4a8abf"/><text x="214" y="51" fill="#4a8abf">2</text>
    <rect x="234" y="36" width="36" height="22" rx="3" fill="#2a3a4a" stroke="#4a8abf"/><text x="252" y="51" fill="#4a8abf">3</text>
    <rect x="272" y="36" width="36" height="22" rx="3" fill="#2a3a4a" stroke="#4a8abf"/><text x="290" y="51" fill="#4a8abf">4</text>
    <rect x="310" y="36" width="36" height="22" rx="3" fill="#2a4a38" stroke="#52b788"/><text x="328" y="51" fill="#52b788">5</text>
    <rect x="348" y="36" width="36" height="22" rx="3" fill="#2a4a38" stroke="#52b788"/><text x="366" y="51" fill="#52b788">6</text>
    <rect x="386" y="36" width="36" height="22" rx="3" fill="#2a4a38" stroke="#52b788"/><text x="404" y="51" fill="#52b788">7</text>
  </g>
  <text x="440" y="51" fill="#888" font-size="9">blue: earlier context, green: this chunk</text>

  <text x="16" y="88" fill="#888" font-size="10">query 0 (pos 5)</text>
  <text x="16" y="114" fill="#888" font-size="10">query 1 (pos 6)</text>
  <text x="16" y="140" fill="#888" font-size="10">query 2 (pos 7)</text>
  <g>
    <rect x="120" y="74" width="226" height="20" fill="#ffcc66" opacity="0.35"/>
    <rect x="348" y="74" width="74" height="20" fill="#333"/>
    <rect x="120" y="100" width="264" height="20" fill="#ffcc66" opacity="0.35"/>
    <rect x="386" y="100" width="36" height="20" fill="#333"/>
    <rect x="120" y="126" width="302" height="20" fill="#ffcc66" opacity="0.35"/>
  </g>
  <text x="440" y="114" fill="#888" font-size="9">yellow: attended, grey: masked</text>

  <text x="16" y="180" fill="#ffcc66" font-size="10">Query i of the chunk sits at position context_len - q_len + i and sees keys 0..that position.</text>
  <text x="16" y="202" fill="#ffcc66" font-size="10">Key at position t: K_cache[block_table[s, t / block_size], t % block_size, kv_head]</text>
  <text x="16" y="224" fill="#ffcc66" font-size="10">GQA: query head h reads kv_head = h / (num_q_heads / num_kv_heads)</text>
</svg>
