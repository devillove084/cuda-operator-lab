<svg width="680" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:20px auto;">
  <rect width="680" height="240" fill="#222" rx="8"/>

  <text x="340" y="22" text-anchor="middle" fill="#ccc" font-size="12" font-family="monospace">
    Block-diagonal causal mask  (T = 6, cu_seqlens = [0, 3, 5, 6])
  </text>

  <!-- Column headers t = 0..5 -->
  <text x="120" y="42" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">u=0</text>
  <text x="155" y="42" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">u=1</text>
  <text x="190" y="42" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">u=2</text>
  <text x="225" y="42" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">u=3</text>
  <text x="260" y="42" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">u=4</text>
  <text x="295" y="42" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">u=5</text>

  <!-- Row labels -->
  <text x="80" y="72"  text-anchor="middle" fill="#888" font-size="10" font-family="monospace">t=0</text>
  <text x="80" y="102" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">t=1</text>
  <text x="80" y="132" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">t=2</text>
  <text x="80" y="162" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">t=3</text>
  <text x="80" y="192" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">t=4</text>
  <text x="80" y="222" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">t=5</text>

  <!-- Sequence 0: rows 0..2, cols 0..2 (lower triangular allowed) -->
  <rect x="100"  y="52"  width="34" height="28" fill="#1a4a8a" stroke="#333"/>
  <rect x="135"  y="52"  width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="170"  y="52"  width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="205"  y="52"  width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="240"  y="52"  width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="275"  y="52"  width="34" height="28" fill="#161616" stroke="#333"/>

  <rect x="100"  y="82"  width="34" height="28" fill="#1a4a8a" stroke="#333"/>
  <rect x="135"  y="82"  width="34" height="28" fill="#1a4a8a" stroke="#333"/>
  <rect x="170"  y="82"  width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="205"  y="82"  width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="240"  y="82"  width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="275"  y="82"  width="34" height="28" fill="#161616" stroke="#333"/>

  <rect x="100"  y="112" width="34" height="28" fill="#1a4a8a" stroke="#333"/>
  <rect x="135"  y="112" width="34" height="28" fill="#1a4a8a" stroke="#333"/>
  <rect x="170"  y="112" width="34" height="28" fill="#1a4a8a" stroke="#333"/>
  <rect x="205"  y="112" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="240"  y="112" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="275"  y="112" width="34" height="28" fill="#161616" stroke="#333"/>

  <!-- Sequence 1: rows 3..4, cols 3..4 -->
  <rect x="100"  y="142" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="135"  y="142" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="170"  y="142" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="205"  y="142" width="34" height="28" fill="#2a7ec0" stroke="#333"/>
  <rect x="240"  y="142" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="275"  y="142" width="34" height="28" fill="#161616" stroke="#333"/>

  <rect x="100"  y="172" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="135"  y="172" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="170"  y="172" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="205"  y="172" width="34" height="28" fill="#2a7ec0" stroke="#333"/>
  <rect x="240"  y="172" width="34" height="28" fill="#2a7ec0" stroke="#333"/>
  <rect x="275"  y="172" width="34" height="28" fill="#161616" stroke="#333"/>

  <!-- Sequence 2: row 5, col 5 -->
  <rect x="100"  y="202" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="135"  y="202" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="170"  y="202" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="205"  y="202" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="240"  y="202" width="34" height="28" fill="#161616" stroke="#333"/>
  <rect x="275"  y="202" width="34" height="28" fill="#7ec8a0" stroke="#333"/>

  <!-- Legend on the right -->
  <rect x="370" y="60"  width="18" height="18" fill="#1a4a8a" stroke="#333"/>
  <text x="395" y="74"  fill="#ccc" font-size="11" font-family="monospace">sequence 0 (length 3)</text>

  <rect x="370" y="90"  width="18" height="18" fill="#2a7ec0" stroke="#333"/>
  <text x="395" y="104" fill="#ccc" font-size="11" font-family="monospace">sequence 1 (length 2)</text>

  <rect x="370" y="120" width="18" height="18" fill="#7ec8a0" stroke="#333"/>
  <text x="395" y="134" fill="#ccc" font-size="11" font-family="monospace">sequence 2 (length 1)</text>

  <rect x="370" y="150" width="18" height="18" fill="#161616" stroke="#333"/>
  <text x="395" y="164" fill="#ccc" font-size="11" font-family="monospace">masked (set to &#x2212;&#x221e;)</text>

  <text x="395" y="200" fill="#888" font-size="10" font-family="monospace">A query at packed row t only sees</text>
  <text x="395" y="214" fill="#888" font-size="10" font-family="monospace">keys in its own sequence, up to t.</text>
</svg>
