  <line x1="410" y1="372" x2="410" y2="648" stroke="#555" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="410" y1="648" x2="297" y2="648" stroke="#555" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>

  <rect x="200" y="387" width="160" height="30" rx="5" fill="#333" stroke="#777" stroke-width="1"/>
  <text x="280" y="407" text-anchor="middle" fill="#ccc" font-size="12" font-family="sans-serif">LayerNorm (no affine)</text>
  <line x1="280" y1="417" x2="280" y2="435" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="200" y="438" width="160" height="30" rx="5" fill="#4d3a1e" stroke="#cc9944" stroke-width="1"/>
  <text x="280" y="458" text-anchor="middle" fill="#eecc99" font-size="12" font-family="sans-serif">Modulate (scale, shift)</text>
  <line x1="280" y1="468" x2="280" y2="486" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="200" y="489" width="160" height="30" rx="5" fill="#1e3d2d" stroke="#44aa66" stroke-width="1"/>
  <text x="280" y="509" text-anchor="middle" fill="#aaeebb" font-size="12" font-family="sans-serif">GELU&#40;Linear 512&#8594;2048&#41;</text>
  <line x1="280" y1="519" x2="280" y2="537" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="200" y="540" width="160" height="30" rx="5" fill="#1e3d2d" stroke="#44aa66" stroke-width="1"/>
  <text x="280" y="560" text-anchor="middle" fill="#aaeebb" font-size="12" font-family="sans-serif">Linear 2048 &#8594; 512</text>
  <line x1="280" y1="570" x2="280" y2="594" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>

  <circle cx="280" cy="606" r="12" fill="#222" stroke="#cc9944" stroke-width="1.5"/>
  <text x="280" y="611" text-anchor="middle" fill="#eecc99" font-size="14" font-family="sans-serif">&#8857;</text>
  <line x1="280" y1="618" x2="280" y2="636" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>

  <circle cx="280" cy="648" r="12" fill="#222" stroke="#999" stroke-width="1.5"/>
  <text x="280" y="653" text-anchor="middle" fill="#ccc" font-size="15" font-family="sans-serif" font-weight="bold">+</text>
  <line x1="280" y1="660" x2="280" y2="684" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>

  <text x="280" y="702" text-anchor="middle" fill="#ccc" font-size="13" font-family="monospace">output (batch, seq_len, 512)</text>
</svg>
