  <line x1="280" y1="283" x2="280" y2="294" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>

  <circle cx="280" cy="306" r="12" fill="#222" stroke="#cc9944" stroke-width="1.5"/>
  <text x="280" y="311" text-anchor="middle" fill="#eecc99" font-size="14" font-family="sans-serif">&#8857;</text>
  <line x1="280" y1="318" x2="280" y2="336" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>

  <circle cx="280" cy="348" r="12" fill="#222" stroke="#999" stroke-width="1.5"/>
  <text x="280" y="353" text-anchor="middle" fill="#ccc" font-size="15" font-family="sans-serif" font-weight="bold">+</text>
  <line x1="280" y1="360" x2="280" y2="384" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>

