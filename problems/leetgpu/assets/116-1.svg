  <line x1="280" y1="36" x2="390" y2="36" stroke="#555" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="390" y1="36" x2="390" y2="348" stroke="#555" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="390" y1="348" x2="297" y2="348" stroke="#555" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>

