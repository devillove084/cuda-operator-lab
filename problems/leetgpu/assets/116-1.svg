  <text x="95" y="120" text-anchor="middle" fill="#eecc99" font-size="12" font-family="sans-serif">Linear 512 &#8594; 3072</text>
  <line x1="95" y1="130" x2="95" y2="148" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="20" y="151" width="150" height="52" rx="5" fill="#333" stroke="#cc9944" stroke-width="1"/>
  <text x="95" y="169" text-anchor="middle" fill="#eecc99" font-size="10" font-family="monospace">shift_msa scale_msa gate_msa</text>
  <text x="95" y="190" text-anchor="middle" fill="#eecc99" font-size="10" font-family="monospace">shift_mlp scale_mlp gate_mlp</text>

