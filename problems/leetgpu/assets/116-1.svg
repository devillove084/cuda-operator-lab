<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 720" width="430" height="720" style="display:block; margin:20px auto;">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#999"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#cc9944"/>
    </marker>
  </defs>
  <rect width="430" height="720" fill="#222"/>

  <!-- ===== conditioning branch ===== -->
  <text x="95" y="20" text-anchor="middle" fill="#ccc" font-size="13" font-family="monospace">c (batch, 512)</text>
  <line x1="95" y1="28" x2="95" y2="46" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="20" y="49" width="150" height="30" rx="5" fill="#4d3a1e" stroke="#cc9944" stroke-width="1"/>
  <text x="95" y="69" text-anchor="middle" fill="#eecc99" font-size="12" font-family="sans-serif">SiLU</text>
