<svg width="700" height="250" viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:20px auto;">
  <rect width="700" height="250" fill="#222"/>
  <defs>
    <marker id="arr155" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
