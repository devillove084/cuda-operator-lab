  <text x="70" y="91" text-anchor="middle" fill="#cce" font-size="11" font-family="monospace">g=0</text>
  <rect x="40" y="142" width="60" height="0" fill="none" stroke="#cc88ff" stroke-width="3"/>
  <rect x="40" y="142" width="60" height="30" fill="#3a2a1a" stroke="#ffaa44" stroke-width="1.5"/>
  <text x="70" y="161" text-anchor="middle" fill="#ecc" font-size="11" font-family="monospace">g=2</text>
  <text x="112" y="146" fill="#cc88ff" font-size="10" font-family="monospace">g=1 (empty)</text>
  <text x="70" y="192" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">M_total &#xd7; K</text>

  <text x="230" y="22" text-anchor="middle" fill="#ccc" font-size="13" font-family="monospace">dY</text>
  <rect x="195" y="32" width="70" height="110" fill="#1a3a5c" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="230" y="91" text-anchor="middle" fill="#cce" font-size="11" font-family="monospace">g=0</text>
  <rect x="195" y="142" width="70" height="30" fill="#3a2a1a" stroke="#ffaa44" stroke-width="1.5"/>
  <text x="230" y="161" text-anchor="middle" fill="#ecc" font-size="11" font-family="monospace">g=2</text>
  <text x="230" y="192" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">M_total &#xd7; N</text>

  <line x1="275" y1="87" x2="390" y2="60" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr155)"/>
  <line x1="275" y1="157" x2="390" y2="200" stroke="#ffaa44" stroke-width="1.5" marker-end="url(#arr155)"/>
  <text x="330" y="125" text-anchor="middle" fill="#aaa" font-size="11" font-family="monospace">X[s:e]&#7488; &#215; dY[s:e]</text>
  <text x="330" y="140" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">sum over tokens</text>

  <text x="450" y="22" text-anchor="middle" fill="#ccc" font-size="13" font-family="monospace">dW</text>
  <rect x="400" y="35" width="100" height="50" fill="#1a4a2a" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="450" y="64" text-anchor="middle" fill="#cce" font-size="11" font-family="monospace">dW[0]</text>
  <rect x="400" y="105" width="100" height="50" fill="#2a2a2a" stroke="#cc88ff" stroke-width="1.5"/>
  <text x="450" y="134" text-anchor="middle" fill="#ecc" font-size="11" font-family="monospace">dW[1] = 0</text>
  <rect x="400" y="175" width="100" height="50" fill="#1a4a2a" stroke="#ffaa44" stroke-width="1.5"/>
  <text x="450" y="204" text-anchor="middle" fill="#ecc" font-size="11" font-family="monospace">dW[2]</text>
  <text x="450" y="242" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">G &#xd7; K &#xd7; N</text>

  <text x="600" y="60" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">long reduction</text>
  <text x="600" y="134" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">no tokens</text>
  <text x="600" y="204" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">short reduction</text>
