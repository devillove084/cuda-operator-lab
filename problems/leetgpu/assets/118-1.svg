<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:20px auto; font-family:monospace;">
  <rect width="700" height="260" fill="#222" rx="8"/>
  <defs>
    <marker id="pe_arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

  <!-- image with patch grid -->
  <text x="86" y="34" fill="#5588cc" font-size="10" text-anchor="middle">image (C, H, W)</text>
  <rect x="26" y="44" width="120" height="120" fill="#2a4a7f" stroke="#5588cc" stroke-width="1.5"/>
  <line x1="66" y1="44" x2="66" y2="164" stroke="#5588cc" stroke-width="1"/>
  <line x1="106" y1="44" x2="106" y2="164" stroke="#5588cc" stroke-width="1"/>
  <line x1="26" y1="84" x2="146" y2="84" stroke="#5588cc" stroke-width="1"/>
  <line x1="26" y1="124" x2="146" y2="124" stroke="#5588cc" stroke-width="1"/>
  <text x="46" y="69" fill="#ccc" font-size="10" text-anchor="middle">0</text>
  <text x="86" y="69" fill="#ccc" font-size="10" text-anchor="middle">1</text>
  <text x="126" y="69" fill="#ccc" font-size="10" text-anchor="middle">2</text>
  <text x="46" y="109" fill="#ccc" font-size="10" text-anchor="middle">3</text>
  <text x="86" y="109" fill="#ccc" font-size="10" text-anchor="middle">4</text>
  <text x="126" y="109" fill="#ccc" font-size="10" text-anchor="middle">5</text>
  <text x="46" y="149" fill="#ccc" font-size="10" text-anchor="middle">6</text>
  <text x="86" y="149" fill="#ccc" font-size="10" text-anchor="middle">7</text>
  <text x="126" y="149" fill="#ccc" font-size="10" text-anchor="middle">8</text>
  <text x="86" y="182" fill="#666" font-size="9" text-anchor="middle">row-major patch order</text>

  <!-- arrow to flattened patches -->
  <line x1="150" y1="104" x2="192" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#pe_arr)"/>
  <text x="171" y="96" fill="#888" font-size="8" text-anchor="middle">flatten</text>

  <!-- flattened patch matrix -->
  <text x="256" y="34" fill="#cc8844" font-size="10" text-anchor="middle">patches</text>
  <rect x="196" y="44" width="120" height="120" fill="#5a3a1a" stroke="#cc8844" stroke-width="1.5"/>
  <line x1="196" y1="84" x2="316" y2="84" stroke="#cc8844" stroke-width="1"/>
  <line x1="196" y1="124" x2="316" y2="124" stroke="#cc8844" stroke-width="1"/>
  <text x="256" y="69" fill="#ccc" font-size="9" text-anchor="middle">patch 0</text>
  <text x="256" y="109" fill="#ccc" font-size="9" text-anchor="middle">&#x22ee;</text>
  <text x="256" y="149" fill="#ccc" font-size="9" text-anchor="middle">patch N-1</text>
  <text x="256" y="182" fill="#666" font-size="9" text-anchor="middle">(N, C&#xb7;P&#xb7;P)</text>

  <!-- arrow to projection -->
  <line x1="320" y1="104" x2="362" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#pe_arr)"/>
  <text x="341" y="96" fill="#888" font-size="8" text-anchor="middle">project</text>

  <!-- projection box -->
  <rect x="366" y="84" width="112" height="40" rx="4" fill="#1a5a3a" stroke="#44aa66" stroke-width="1.5"/>
  <text x="422" y="108" fill="#ccc" font-size="10" text-anchor="middle">W&#x1d40; + bias</text>
  <text x="422" y="140" fill="#666" font-size="9" text-anchor="middle">(C&#xb7;P&#xb7;P, D)</text>

  <!-- arrow to tokens -->
  <line x1="482" y1="104" x2="524" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#pe_arr)"/>

  <!-- token sequence -->
  <text x="602" y="34" fill="#cc44cc" font-size="10" text-anchor="middle">output (N+1, D)</text>
  <rect x="528" y="44" width="148" height="30" rx="3" fill="#3a1a3a" stroke="#cc44cc" stroke-width="1.5"/>
  <text x="602" y="64" fill="#ccc" font-size="10" text-anchor="middle">cls_token</text>
  <rect x="528" y="78" width="148" height="30" rx="3" fill="#3a1a3a" stroke="#cc44cc" stroke-width="1.5"/>
  <text x="602" y="98" fill="#ccc" font-size="10" text-anchor="middle">token 0</text>
  <rect x="528" y="112" width="148" height="26" rx="3" fill="#3a1a3a" stroke="#cc44cc" stroke-width="1.5"/>
  <text x="602" y="130" fill="#ccc" font-size="10" text-anchor="middle">&#x22ee;</text>
  <rect x="528" y="142" width="148" height="30" rx="3" fill="#3a1a3a" stroke="#cc44cc" stroke-width="1.5"/>
  <text x="602" y="162" fill="#ccc" font-size="10" text-anchor="middle">token N-1</text>
  <text x="602" y="192" fill="#666" font-size="9" text-anchor="middle">+ pos_embed (row by row)</text>

  <text x="350" y="228" fill="#888" font-size="10" text-anchor="middle">repeated independently for each of the B images in the batch</text>
  <text x="350" y="246" fill="#666" font-size="9" text-anchor="middle">patch n covers rows [n / (W/P) &#xb7; P, ...) and columns [n mod (W/P) &#xb7; P, ...) of the image</text>
</svg>
