<svg width="760" height="330" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:20px auto;">
  <rect width="760" height="330" fill="#222" rx="10"/>
  <text x="380" y="26" fill="#ccc" font-family="monospace" font-size="13" text-anchor="middle">Query-aware block selection (block_size = 4, num_selected = 2)</text>

  <!-- KV cache blocks -->
  <text x="60" y="58" fill="#aaa" font-family="monospace" font-size="12">K cache</text>
  <rect x="140" y="44" width="100" height="24" fill="#1d4ed8" rx="3"/>
  <rect x="245" y="44" width="100" height="24" fill="#1d4ed8" rx="3"/>
  <rect x="350" y="44" width="100" height="24" fill="#1d4ed8" rx="3"/>
  <rect x="455" y="44" width="100" height="24" fill="#1d4ed8" rx="3"/>
  <rect x="560" y="44" width="50" height="24" fill="#1e3a8a" rx="3"/>
  <text x="190" y="61" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">block 0</text>
  <text x="295" y="61" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">block 1</text>
  <text x="400" y="61" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">block 2</text>
  <text x="505" y="61" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">block 3</text>
  <text x="585" y="61" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">tail</text>
  <text x="585" y="84" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">partial</text>

  <!-- pooled keys -->
  <text x="60" y="112" fill="#aaa" font-family="monospace" font-size="12">mean key</text>
  <rect x="170" y="98" width="40" height="24" fill="#0f766e" rx="3"/>
  <rect x="275" y="98" width="40" height="24" fill="#0f766e" rx="3"/>
  <rect x="380" y="98" width="40" height="24" fill="#0f766e" rx="3"/>
  <rect x="485" y="98" width="40" height="24" fill="#0f766e" rx="3"/>
  <rect x="565" y="98" width="40" height="24" fill="#0f766e" rx="3"/>
  <line x1="190" y1="70" x2="190" y2="96" stroke="#888" stroke-width="1.2" marker-end="url(#arr119)"/>
  <line x1="295" y1="70" x2="295" y2="96" stroke="#888" stroke-width="1.2" marker-end="url(#arr119)"/>
  <line x1="400" y1="70" x2="400" y2="96" stroke="#888" stroke-width="1.2" marker-end="url(#arr119)"/>
  <line x1="505" y1="70" x2="505" y2="96" stroke="#888" stroke-width="1.2" marker-end="url(#arr119)"/>
  <line x1="585" y1="70" x2="585" y2="96" stroke="#888" stroke-width="1.2" marker-end="url(#arr119)"/>

  <!-- scores -->
  <text x="60" y="152" fill="#aaa" font-family="monospace" font-size="12">Q &#xb7; mean</text>
  <text x="190" y="152" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">0.4</text>
  <text x="295" y="152" fill="#4ade80" font-family="monospace" font-size="12" text-anchor="middle">2.1</text>
  <text x="400" y="152" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">-0.7</text>
  <text x="505" y="152" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">0.2</text>
  <text x="585" y="152" fill="#4ade80" font-family="monospace" font-size="12" text-anchor="middle">1.5</text>

  <!-- selected -->
  <text x="60" y="192" fill="#aaa" font-family="monospace" font-size="12">selected</text>
  <rect x="140" y="178" width="100" height="24" fill="#3f3f46" rx="3"/>
  <rect x="245" y="178" width="100" height="24" fill="#9333ea" rx="3"/>
  <rect x="350" y="178" width="100" height="24" fill="#3f3f46" rx="3"/>
  <rect x="455" y="178" width="100" height="24" fill="#3f3f46" rx="3"/>
  <rect x="560" y="178" width="50" height="24" fill="#9333ea" rx="3"/>
  <text x="190" y="195" fill="#71717a" font-family="monospace" font-size="11" text-anchor="middle">skip</text>
  <text x="295" y="195" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">read</text>
  <text x="400" y="195" fill="#71717a" font-family="monospace" font-size="11" text-anchor="middle">skip</text>
  <text x="505" y="195" fill="#71717a" font-family="monospace" font-size="11" text-anchor="middle">skip</text>
  <text x="585" y="195" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">read</text>

  <!-- softmax -->
  <rect x="245" y="220" width="100" height="24" fill="#b45309" rx="3"/>
  <rect x="560" y="220" width="50" height="24" fill="#b45309" rx="3"/>
  <text x="295" y="237" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">Q&#xb7;K / &#x221a;d</text>
  <text x="585" y="237" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">Q&#xb7;K</text>
  <text x="640" y="237" fill="#aaa" font-family="monospace" font-size="11">one softmax</text>
  <text x="640" y="252" fill="#aaa" font-family="monospace" font-size="11">over both blocks</text>

  <rect x="60" y="272" width="640" height="44" fill="#2d2d2d" rx="6"/>
  <text x="380" y="290" fill="#ccc" font-family="monospace" font-size="11" text-anchor="middle">the softmax denominator covers only the selected positions, so scores of skipped</text>
  <text x="380" y="306" fill="#ccc" font-family="monospace" font-size="11" text-anchor="middle">blocks never enter the normalization; every head picks its own blocks</text>

  <defs>
    <marker id="arr119" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
