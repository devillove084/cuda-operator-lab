<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Per-head recurrence: the state S is multiplied by the decay a_t, the rank-1 update delta_t x_t B_t transposed is added, the state is read out with C_t, then D x_t is added and the sum is gated by silu of z_t">
  <rect width="640" height="200" fill="#222" rx="8"/>
  <text x="14" y="22" fill="#ccc" font-family="monospace" font-size="12">one head h, group g = h / (num_heads / num_groups)</text>
  <rect x="20" y="70" width="70" height="44" fill="#455a64" rx="4"/>
  <text x="34" y="97" fill="#fff" font-family="monospace" font-size="13">S[t-1]</text>
  <line x1="90" y1="92" x2="150" y2="92" stroke="#ccc" stroke-width="2"/>
  <circle cx="165" cy="92" r="15" fill="#ff9800"/>
  <text x="160" y="97" fill="#000" font-family="monospace" font-size="14">&#215;</text>
  <text x="128" y="60" fill="#ff9800" font-family="monospace" font-size="12">a_t = exp(&#916;_t A_h)</text>
  <line x1="180" y1="92" x2="240" y2="92" stroke="#ccc" stroke-width="2"/>
  <circle cx="255" cy="92" r="15" fill="#4caf50"/>
  <text x="249" y="97" fill="#000" font-family="monospace" font-size="16">+</text>
  <line x1="255" y1="150" x2="255" y2="107" stroke="#4caf50" stroke-width="2"/>
  <text x="196" y="168" fill="#4caf50" font-family="monospace" font-size="12">&#916;_t x_t B_t&#7488;  (rank 1)</text>
  <line x1="270" y1="92" x2="320" y2="92" stroke="#ccc" stroke-width="2"/>
  <rect x="320" y="70" width="60" height="44" fill="#455a64" rx="4"/>
  <text x="333" y="97" fill="#fff" font-family="monospace" font-size="13">S[t]</text>
  <line x1="380" y1="92" x2="430" y2="92" stroke="#ccc" stroke-width="2"/>
  <text x="384" y="84" fill="#2196f3" font-family="monospace" font-size="12">&#183; C_t</text>
  <circle cx="445" cy="92" r="15" fill="#4caf50"/>
  <text x="439" y="97" fill="#000" font-family="monospace" font-size="16">+</text>
  <line x1="445" y1="150" x2="445" y2="107" stroke="#4caf50" stroke-width="2"/>
  <text x="425" y="168" fill="#4caf50" font-family="monospace" font-size="12">D_h x_t</text>
  <line x1="460" y1="92" x2="510" y2="92" stroke="#ccc" stroke-width="2"/>
  <circle cx="525" cy="92" r="15" fill="#e91e63"/>
  <text x="520" y="97" fill="#000" font-family="monospace" font-size="14">&#215;</text>
  <text x="490" y="60" fill="#e91e63" font-family="monospace" font-size="12">silu(z_t)</text>
  <line x1="540" y1="92" x2="590" y2="92" stroke="#ccc" stroke-width="2"/>
  <text x="596" y="97" fill="#fff" font-family="monospace" font-size="13">y_t</text>
  <path d="M350 114 Q350 140 90 140 Q55 140 55 114" stroke="#888" fill="none" stroke-dasharray="4 3"/>
  <text x="120" y="134" fill="#888" font-family="monospace" font-size="11">next token</text>
</svg>
