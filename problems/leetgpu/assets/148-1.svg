<svg width="620" height="230" viewBox="0 0 620 230" xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:20px auto; font-family:monospace;">
  <rect width="620" height="230" fill="#222" rx="8"/>
  <text x="16" y="22" fill="#ccc" font-size="11" font-weight="bold">One head h (each row of Q, K, V has 2 &#215; head_dim features)</text>
  <g font-size="10" text-anchor="middle">
    <rect x="20" y="40" width="80" height="24" rx="3" fill="#2a3a4a" stroke="#4a8abf"/><text x="60" y="56" fill="#4a8abf">Q1 | K1</text>
    <rect x="20" y="100" width="80" height="24" rx="3" fill="#2a4a38" stroke="#52b788"/><text x="60" y="116" fill="#52b788">Q2 | K2</text>
    <rect x="140" y="40" width="150" height="24" rx="3" fill="#2a3a4a" stroke="#4a8abf"/><text x="215" y="56" fill="#4a8abf">A1 = causal softmax</text>
    <rect x="140" y="100" width="150" height="24" rx="3" fill="#2a4a38" stroke="#52b788"/><text x="215" y="116" fill="#52b788">A2 = causal softmax</text>
    <rect x="330" y="70" width="110" height="24" rx="3" fill="#4a3a2a" stroke="#ffcc66"/><text x="385" y="86" fill="#ffcc66">(A1 - &#955;A2) V</text>
    <rect x="470" y="70" width="130" height="24" rx="3" fill="#4a2a3a" stroke="#e07a9a"/><text x="535" y="86" fill="#e07a9a">RMSNorm &#215; (1-&#955;init)</text>
  </g>
  <g stroke="#888" stroke-width="1.2" fill="none">
    <line x1="100" y1="52" x2="138" y2="52"/><line x1="100" y1="112" x2="138" y2="112"/>
    <line x1="290" y1="52" x2="328" y2="78"/><line x1="290" y1="112" x2="328" y2="86"/>
    <line x1="440" y1="82" x2="468" y2="82"/>
  </g>
  <text x="16" y="160" fill="#ffcc66" font-size="10">Q1 = Q[:, h, 0:head_dim], Q2 = Q[:, h, head_dim:2*head_dim]; K1, K2 likewise</text>
  <text x="16" y="182" fill="#ffcc66" font-size="10">Scores use scale 1 / sqrt(head_dim); query i attends to keys 0..i</text>
  <text x="16" y="204" fill="#ffcc66" font-size="10">V[:, h] keeps all 2 * head_dim features; lambda is lambdas[h]</text>
</svg>
