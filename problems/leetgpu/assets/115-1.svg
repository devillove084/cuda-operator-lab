<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:20px auto; font-family:monospace;">
  <rect width="700" height="360" fill="#222" rx="8"/>
  <defs>
    <marker id="qkvarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="qkvarrm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#cc44cc"/>
    </marker>
  </defs>

  <text x="450" y="20" fill="#999" font-size="10" text-anchor="middle">
    qkv = x[b] &#xb7; W_qkv &#x2192; (H_q + 2&#xb7;H_kv)&#xb7;D values
  </text>

  <rect x="16" y="34" width="56" height="34" rx="4" fill="#2a4a7f" stroke="#5588cc" stroke-width="1.5"/>
  <text x="44" y="56" fill="#ccc" font-size="11" text-anchor="middle">x[b]</text>
  <text x="44" y="84" fill="#666" font-size="8" text-anchor="middle">[d_model]</text>

  <line x1="72" y1="51" x2="102" y2="51" stroke="#888" stroke-width="1.5" marker-end="url(#qkvarr)"/>

  <rect x="106" y="34" width="80" height="34" rx="4" fill="#444" stroke="#888" stroke-width="1.5"/>
  <text x="146" y="56" fill="#ccc" font-size="11" text-anchor="middle">&#xb7; W_qkv</text>

  <line x1="186" y1="51" x2="216" y2="51" stroke="#888" stroke-width="1.5" marker-end="url(#qkvarr)"/>

  <rect x="220" y="34" width="240" height="34" fill="#2a4a7f" stroke="#5588cc" stroke-width="1.5"/>
  <text x="340" y="56" fill="#ccc" font-size="11" text-anchor="middle">Q (H_q &#xb7; D)</text>
  <rect x="460" y="34" width="110" height="34" fill="#1a5a3a" stroke="#44aa66" stroke-width="1.5"/>
  <text x="515" y="56" fill="#ccc" font-size="10" text-anchor="middle">K (H_kv &#xb7; D)</text>
  <rect x="570" y="34" width="110" height="34" fill="#5a3a1a" stroke="#cc8844" stroke-width="1.5"/>
  <text x="625" y="56" fill="#ccc" font-size="10" text-anchor="middle">V (H_kv &#xb7; D)</text>

  <line x1="340" y1="68" x2="340" y2="106" stroke="#5588cc" stroke-width="1.5" marker-end="url(#qkvarr)"/>
  <line x1="515" y1="68" x2="515" y2="106" stroke="#44aa66" stroke-width="1.5" marker-end="url(#qkvarr)"/>
  <line x1="625" y1="68" x2="625" y2="188" stroke="#cc8844" stroke-width="1.5" marker-end="url(#qkvarr)"/>

  <rect x="30" y="110" width="225" height="36" rx="4" fill="#3a1a3a" stroke="#cc44cc" stroke-width="1.5"/>
  <text x="142" y="127" fill="#ccc" font-size="10" text-anchor="middle">cos_sin_cache[pos[b]]</text>
  <text x="142" y="140" fill="#999" font-size="8" text-anchor="middle">cos = [0 : D/2], sin = [D/2 : D]</text>

  <line x1="255" y1="128" x2="271" y2="128" stroke="#cc44cc" stroke-width="1.5" marker-end="url(#qkvarrm)"/>

  <rect x="275" y="110" width="305" height="36" rx="4" fill="#1a3a5a" stroke="#5588cc" stroke-width="1.5"/>
  <text x="427" y="133" fill="#ccc" font-size="11" text-anchor="middle">RoPE rotate-half (Q and K only)</text>

  <line x1="330" y1="146" x2="152" y2="188" stroke="#888" stroke-width="1.5" marker-end="url(#qkvarr)"/>
  <line x1="480" y1="146" x2="404" y2="188" stroke="#888" stroke-width="1.5" marker-end="url(#qkvarr)"/>

  <rect x="30" y="192" width="200" height="38" rx="4" fill="#3a1a3a" stroke="#cc44cc" stroke-width="1.5"/>
  <text x="130" y="209" fill="#ccc" font-size="11" text-anchor="middle">Q_out[b]</text>
  <text x="130" y="223" fill="#999" font-size="8" text-anchor="middle">[H_q, D]</text>

  <rect x="270" y="192" width="200" height="38" rx="4" fill="#1a5a3a" stroke="#44aa66" stroke-width="1.5"/>
  <text x="370" y="216" fill="#ccc" font-size="10" text-anchor="middle">K_cache[b, :, pos[b], :]</text>

  <rect x="500" y="192" width="170" height="38" rx="4" fill="#5a3a1a" stroke="#cc8844" stroke-width="1.5"/>
  <text x="585" y="216" fill="#ccc" font-size="10" text-anchor="middle">V_cache[b, :, pos[b], :]</text>

  <text x="400" y="262" fill="#999" font-size="10" text-anchor="middle">
    one (b, h) row of the cache: S_max slots
  </text>

  <rect x="200" y="270" width="40" height="30" fill="#3a3a3a" stroke="#222" stroke-width="1"/>
  <rect x="240" y="270" width="40" height="30" fill="#3a3a3a" stroke="#222" stroke-width="1"/>
  <rect x="280" y="270" width="40" height="30" fill="#3a3a3a" stroke="#222" stroke-width="1"/>
  <rect x="320" y="270" width="40" height="30" fill="#3a3a3a" stroke="#222" stroke-width="1"/>
  <rect x="360" y="270" width="40" height="30" fill="#3a3a3a" stroke="#222" stroke-width="1"/>
  <rect x="400" y="270" width="40" height="30" fill="#1a5a3a" stroke="#44aa66" stroke-width="1.5"/>
  <rect x="440" y="270" width="40" height="30" fill="#3a3a3a" stroke="#222" stroke-width="1"/>
  <rect x="480" y="270" width="40" height="30" fill="#3a3a3a" stroke="#222" stroke-width="1"/>
  <rect x="520" y="270" width="40" height="30" fill="#3a3a3a" stroke="#222" stroke-width="1"/>
  <rect x="560" y="270" width="40" height="30" fill="#3a3a3a" stroke="#222" stroke-width="1"/>
  <rect x="200" y="270" width="400" height="30" fill="none" stroke="#555" stroke-width="1"/>

  <text x="420" y="316" fill="#44aa66" font-size="10" text-anchor="middle">pos[b]</text>
  <text x="400" y="340" fill="#999" font-size="10" text-anchor="middle">
    only slot pos[b] is written &#x2014; every other slot keeps its previous contents
  </text>
</svg>
