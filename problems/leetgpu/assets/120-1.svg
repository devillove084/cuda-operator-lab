<svg width="640" height="230" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:20px auto;">
  <style>
    text { font-family: monospace; fill: #cccccc; }
  </style>
  <defs>
    <marker id="kda-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>
  <rect width="640" height="230" fill="#222222" rx="6"/>

  <text x="320" y="26" text-anchor="middle" font-size="12">one recurrence step (per batch element)</text>

  <g stroke="#666666" stroke-width="1">
    <rect x="45" y="80" width="72" height="72" fill="#4da6ff" fill-opacity="0.55"/>
    <line x1="45" y1="98" x2="117" y2="98"/>
    <line x1="45" y1="116" x2="117" y2="116"/>
    <line x1="45" y1="134" x2="117" y2="134"/>
    <line x1="63" y1="80" x2="63" y2="152"/>
    <line x1="81" y1="80" x2="81" y2="152"/>
    <line x1="99" y1="80" x2="99" y2="152"/>
  </g>
  <text x="81" y="72" text-anchor="middle" font-size="12">S(t-1)</text>

  <text x="134" y="122" text-anchor="middle" font-size="15">&#x2299;</text>

  <g stroke="#666666" stroke-width="1">
    <rect x="151" y="80" width="18" height="18" fill="#ffa64d" fill-opacity="0.9"/>
    <rect x="151" y="98" width="18" height="18" fill="#ffa64d" fill-opacity="0.45"/>
    <rect x="151" y="116" width="18" height="18" fill="#ffa64d" fill-opacity="0.7"/>
    <rect x="151" y="134" width="18" height="18" fill="#ffa64d" fill-opacity="0.2"/>
  </g>
  <text x="160" y="72" text-anchor="middle" font-size="12">a(t)</text>

  <line x1="180" y1="116" x2="212" y2="116" stroke="#888888" stroke-width="1.5"
        marker-end="url(#kda-arrow)"/>

  <g stroke="#666666" stroke-width="1">
    <rect x="222" y="80" width="72" height="18" fill="#4da6ff" fill-opacity="0.5"/>
    <rect x="222" y="98" width="72" height="18" fill="#4da6ff" fill-opacity="0.25"/>
    <rect x="222" y="116" width="72" height="18" fill="#4da6ff" fill-opacity="0.39"/>
    <rect x="222" y="134" width="72" height="18" fill="#4da6ff" fill-opacity="0.11"/>
    <line x1="240" y1="80" x2="240" y2="152"/>
    <line x1="258" y1="80" x2="258" y2="152"/>
    <line x1="276" y1="80" x2="276" y2="152"/>
  </g>
  <text x="258" y="72" text-anchor="middle" font-size="12">decayed state</text>

  <text x="360" y="102" text-anchor="middle" font-size="11">delta rule</text>
  <text x="360" y="140" text-anchor="middle" font-size="10">+ b(t) k(t) (v(t) - k(t)&#x1D40; S)&#x1D40;</text>
  <line x1="304" y1="116" x2="420" y2="116" stroke="#888888" stroke-width="1.5"
        marker-end="url(#kda-arrow)"/>

  <g stroke="#666666" stroke-width="1">
    <rect x="430" y="80" width="72" height="72" fill="#66d9a6" fill-opacity="0.5"/>
    <line x1="430" y1="98" x2="502" y2="98"/>
    <line x1="430" y1="116" x2="502" y2="116"/>
    <line x1="430" y1="134" x2="502" y2="134"/>
    <line x1="448" y1="80" x2="448" y2="152"/>
    <line x1="466" y1="80" x2="466" y2="152"/>
    <line x1="484" y1="80" x2="484" y2="152"/>
  </g>
  <text x="466" y="72" text-anchor="middle" font-size="12">S(t)</text>

  <line x1="512" y1="116" x2="544" y2="116" stroke="#888888" stroke-width="1.5"
        marker-end="url(#kda-arrow)"/>
  <text x="592" y="112" text-anchor="middle" font-size="11">o(t) =</text>
  <text x="592" y="128" text-anchor="middle" font-size="11">S(t)&#x1D40; q(t)</text>

  <text x="320" y="186" text-anchor="middle" font-size="11">Row i of the state carries its own forget gate a(t)[i], so channels decay</text>
  <text x="320" y="202" text-anchor="middle" font-size="11">at different rates; the delta rule then overwrites the value bound to k(t).</text>
</svg>
