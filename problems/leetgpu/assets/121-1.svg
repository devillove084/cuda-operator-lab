<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:20px auto; font-family:monospace;">
  <rect width="700" height="300" fill="#222" rx="8"/>
  <defs>
    <marker id="lp_arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

  <text x="350" y="26" fill="#aaa" font-size="11" text-anchor="middle">one request (row b), V = 6</text>

  <!-- token histories -->
  <text x="90" y="56" fill="#cc8844" font-size="10" text-anchor="middle">prompt_tokens[b]</text>
  <rect x="20" y="64" width="140" height="26" fill="#5a3a1a" stroke="#cc8844" stroke-width="1.5"/>
  <line x1="66" y1="64" x2="66" y2="90" stroke="#cc8844" stroke-width="1"/>
  <line x1="113" y1="64" x2="113" y2="90" stroke="#cc8844" stroke-width="1"/>
  <text x="43" y="82" fill="#ccc" font-size="11" text-anchor="middle">1</text>
  <text x="90" y="82" fill="#ccc" font-size="11" text-anchor="middle">3</text>
  <text x="136" y="82" fill="#666" font-size="11" text-anchor="middle">-1</text>

  <text x="90" y="124" fill="#5588cc" font-size="10" text-anchor="middle">output_tokens[b]</text>
  <rect x="20" y="132" width="140" height="26" fill="#2a4a7f" stroke="#5588cc" stroke-width="1.5"/>
  <line x1="55" y1="132" x2="55" y2="158" stroke="#5588cc" stroke-width="1"/>
  <line x1="90" y1="132" x2="90" y2="158" stroke="#5588cc" stroke-width="1"/>
  <line x1="125" y1="132" x2="125" y2="158" stroke="#5588cc" stroke-width="1"/>
  <text x="37" y="150" fill="#ccc" font-size="11" text-anchor="middle">2</text>
  <text x="72" y="150" fill="#ccc" font-size="11" text-anchor="middle">2</text>
  <text x="107" y="150" fill="#ccc" font-size="11" text-anchor="middle">5</text>
  <text x="142" y="150" fill="#666" font-size="11" text-anchor="middle">-1</text>
  <text x="90" y="176" fill="#666" font-size="9" text-anchor="middle">-1 = padding, skipped</text>

  <!-- scatter arrow -->
  <line x1="166" y1="110" x2="226" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#lp_arr)"/>
  <text x="196" y="102" fill="#888" font-size="8" text-anchor="middle">scatter</text>
  <text x="196" y="124" fill="#888" font-size="8" text-anchor="middle">count</text>

  <!-- count table -->
  <text x="330" y="56" fill="#aaa" font-size="10" text-anchor="middle">per-request table over the vocabulary</text>
  <text x="248" y="82" fill="#888" font-size="9" text-anchor="end">v</text>
  <text x="248" y="110" fill="#5588cc" font-size="9" text-anchor="end">count c</text>
  <text x="248" y="138" fill="#cc8844" font-size="9" text-anchor="end">seen s</text>
  <g font-size="10" text-anchor="middle">
    <text x="275" y="82" fill="#888">0</text>
    <text x="330" y="82" fill="#888">1</text>
    <text x="385" y="82" fill="#888">2</text>
    <text x="440" y="82" fill="#888">3</text>
    <text x="495" y="82" fill="#888">4</text>
    <text x="550" y="82" fill="#888">5</text>
  </g>
  <rect x="250" y="92" width="330" height="24" fill="#2a4a7f" stroke="#5588cc" stroke-width="1.5"/>
  <rect x="250" y="120" width="330" height="24" fill="#5a3a1a" stroke="#cc8844" stroke-width="1.5"/>
  <g font-size="10" text-anchor="middle" fill="#ccc">
    <text x="275" y="108">0</text>
    <text x="330" y="108">0</text>
    <text x="385" y="108">2</text>
    <text x="440" y="108">0</text>
    <text x="495" y="108">0</text>
    <text x="550" y="108">1</text>
    <text x="275" y="136">0</text>
    <text x="330" y="136">1</text>
    <text x="385" y="136">1</text>
    <text x="440" y="136">1</text>
    <text x="495" y="136">0</text>
    <text x="550" y="136">1</text>
  </g>
  <g stroke="#5588cc" stroke-width="1">
    <line x1="305" y1="92" x2="305" y2="116"/>
    <line x1="360" y1="92" x2="360" y2="116"/>
    <line x1="415" y1="92" x2="415" y2="116"/>
    <line x1="470" y1="92" x2="470" y2="116"/>
    <line x1="525" y1="92" x2="525" y2="116"/>
  </g>
  <g stroke="#cc8844" stroke-width="1">
    <line x1="305" y1="120" x2="305" y2="144"/>
    <line x1="360" y1="120" x2="360" y2="144"/>
    <line x1="415" y1="120" x2="415" y2="144"/>
    <line x1="470" y1="120" x2="470" y2="144"/>
    <line x1="525" y1="120" x2="525" y2="144"/>
  </g>

  <!-- logits row -->
  <text x="248" y="196" fill="#888" font-size="9" text-anchor="end">logits</text>
  <rect x="250" y="180" width="330" height="24" fill="#333" stroke="#777" stroke-width="1.5"/>
  <g font-size="10" text-anchor="middle" fill="#ccc">
    <text x="275" y="196">1.0</text>
    <text x="330" y="196">-2.0</text>
    <text x="385" y="196">3.0</text>
    <text x="440" y="196">0.5</text>
    <text x="495" y="196">0.0</text>
    <text x="550" y="196">-1.0</text>
  </g>
  <g stroke="#777" stroke-width="1">
    <line x1="305" y1="180" x2="305" y2="204"/>
    <line x1="360" y1="180" x2="360" y2="204"/>
    <line x1="415" y1="180" x2="415" y2="204"/>
    <line x1="470" y1="180" x2="470" y2="204"/>
    <line x1="525" y1="180" x2="525" y2="204"/>
  </g>

  <line x1="415" y1="208" x2="415" y2="238" stroke="#888" stroke-width="1.5" marker-end="url(#lp_arr)"/>
  <text x="470" y="228" fill="#888" font-size="9" text-anchor="middle">r = 2.0, freq = 0.25, pres = 0.5</text>

  <!-- output row -->
  <text x="248" y="258" fill="#44aa66" font-size="9" text-anchor="end">output</text>
  <rect x="250" y="242" width="330" height="24" fill="#1a5a3a" stroke="#44aa66" stroke-width="1.5"/>
  <g font-size="10" text-anchor="middle" fill="#ccc">
    <text x="275" y="258">1.0</text>
    <text x="330" y="258">-4.0</text>
    <text x="385" y="258">0.5</text>
    <text x="440" y="258">0.25</text>
    <text x="495" y="258">0.0</text>
    <text x="550" y="258">-2.75</text>
  </g>
  <g stroke="#44aa66" stroke-width="1">
    <line x1="305" y1="242" x2="305" y2="266"/>
    <line x1="360" y1="242" x2="360" y2="266"/>
    <line x1="415" y1="242" x2="415" y2="266"/>
    <line x1="470" y1="242" x2="470" y2="266"/>
    <line x1="525" y1="242" x2="525" y2="266"/>
  </g>
  <text x="415" y="286" fill="#666" font-size="9" text-anchor="middle">v = 4 was never seen, so its logit passes through untouched</text>
</svg>
