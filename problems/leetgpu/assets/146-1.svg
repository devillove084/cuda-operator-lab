<svg width="640" height="220" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:20px auto; font-family:monospace;">
  <rect width="640" height="220" fill="#222" rx="8"/>
  <text x="16" y="24" fill="#ccc" font-size="12" font-weight="bold">x[M,H] × W_gate_up[H,2I] → silu(gate) * up</text>

  <rect x="20" y="50" width="70" height="90" rx="4" fill="#2a3a4a" stroke="#4a8abf"/>
  <text x="55" y="100" fill="#4a8abf" font-size="11" text-anchor="middle">x</text>
  <text x="55" y="116" fill="#888" font-size="9" text-anchor="middle">M×H</text>

  <text x="105" y="100" fill="#ccc" font-size="18">×</text>

  <rect x="130" y="50" width="50" height="90" rx="4" fill="#2a4a38" stroke="#52b788"/>
  <text x="155" y="90" fill="#52b788" font-size="10" text-anchor="middle">gate</text>
  <text x="155" y="106" fill="#888" font-size="9" text-anchor="middle">H×I</text>
  <rect x="180" y="50" width="50" height="90" rx="4" fill="#4a3a2a" stroke="#e09f3e"/>
  <text x="205" y="90" fill="#e09f3e" font-size="10" text-anchor="middle">up</text>
  <text x="205" y="106" fill="#888" font-size="9" text-anchor="middle">H×I</text>
  <text x="180" y="160" fill="#888" font-size="9" text-anchor="middle">W_gate_up = [gate | up]</text>

  <text x="250" y="100" fill="#ccc" font-size="18">→</text>

  <rect x="280" y="50" width="50" height="90" rx="4" fill="#2a4a38" stroke="#52b788"/>
  <text x="305" y="90" fill="#52b788" font-size="10" text-anchor="middle">gate</text>
  <text x="305" y="106" fill="#888" font-size="9" text-anchor="middle">M×I</text>
  <rect x="330" y="50" width="50" height="90" rx="4" fill="#4a3a2a" stroke="#e09f3e"/>
  <text x="355" y="90" fill="#e09f3e" font-size="10" text-anchor="middle">up</text>
  <text x="355" y="106" fill="#888" font-size="9" text-anchor="middle">M×I</text>

  <text x="400" y="85" fill="#ffcc66" font-size="11">SiLU</text>
  <text x="400" y="110" fill="#ffcc66" font-size="11">×</text>

  <text x="450" y="100" fill="#ccc" font-size="18">→</text>

  <rect x="480" y="50" width="70" height="90" rx="4" fill="#3a2a4a" stroke="#c77dff"/>
  <text x="515" y="100" fill="#c77dff" font-size="11" text-anchor="middle">output</text>
  <text x="515" y="116" fill="#888" font-size="9" text-anchor="middle">M×I</text>

  <text x="16" y="190" fill="#ffcc66" font-size="10">SiLU(z) = z · σ(z) = z / (1 + e^{-z}). Columns [0, I) of the GEMM are the gate; [I, 2I) are up.</text>
  <text x="16" y="208" fill="#ffcc66" font-size="10">Distinct from #54 (elementwise only, no GEMM) and #84 (adds the down-projection GEMM).</text>
</svg>
