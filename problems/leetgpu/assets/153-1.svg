<svg width="420" height="150" viewBox="0 0 420 150" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Rotate-half RoPE: element d of the first half of a head vector is paired with element d plus head_dim over 2, and the pair is rotated by the angle for that position and frequency">
  <rect width="420" height="150" fill="#222" rx="8"/>
  <text x="14" y="24" fill="#ccc" font-family="monospace" font-size="12">x (one head, head_dim = 8)</text>
  <rect x="14" y="34" width="44" height="28" fill="#4caf50"/>
  <rect x="60" y="34" width="44" height="28" fill="#2196f3"/>
  <rect x="106" y="34" width="44" height="28" fill="#ff9800"/>
  <rect x="152" y="34" width="44" height="28" fill="#e91e63"/>
  <rect x="198" y="34" width="44" height="28" fill="#4caf50" opacity="0.6"/>
  <rect x="244" y="34" width="44" height="28" fill="#2196f3" opacity="0.6"/>
  <rect x="290" y="34" width="44" height="28" fill="#ff9800" opacity="0.6"/>
  <rect x="336" y="34" width="44" height="28" fill="#e91e63" opacity="0.6"/>
  <text x="30" y="53" fill="#fff" font-family="monospace" font-size="12">x0</text>
  <text x="76" y="53" fill="#fff" font-family="monospace" font-size="12">x1</text>
  <text x="122" y="53" fill="#fff" font-family="monospace" font-size="12">x2</text>
  <text x="168" y="53" fill="#fff" font-family="monospace" font-size="12">x3</text>
  <text x="214" y="53" fill="#fff" font-family="monospace" font-size="12">x4</text>
  <text x="260" y="53" fill="#fff" font-family="monospace" font-size="12">x5</text>
  <text x="306" y="53" fill="#fff" font-family="monospace" font-size="12">x6</text>
  <text x="352" y="53" fill="#fff" font-family="monospace" font-size="12">x7</text>
  <path d="M36 64 Q128 100 220 64" stroke="#4caf50" fill="none" stroke-width="2"/>
  <path d="M82 64 Q174 100 266 64" stroke="#2196f3" fill="none" stroke-width="2"/>
  <path d="M128 64 Q220 100 312 64" stroke="#ff9800" fill="none" stroke-width="2"/>
  <path d="M174 64 Q266 100 358 64" stroke="#e91e63" fill="none" stroke-width="2"/>
  <text x="14" y="124" fill="#ccc" font-family="monospace" font-size="12">pair d = (x[d], x[d + 4]) rotated by angle with cos[pos, d], sin[pos, d]</text>
</svg>
