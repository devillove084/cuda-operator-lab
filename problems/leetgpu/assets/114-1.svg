<svg width="720" height="300" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:20px auto;">
  <rect width="720" height="300" fill="#222" rx="10"/>
  <text x="360" y="26" fill="#ccc" font-family="monospace" font-size="13" text-anchor="middle">MLA decode: one shared latent cache serves all heads</text>

  <!-- Cache -->
  <text x="150" y="56" fill="#aaa" font-family="monospace" font-size="12" text-anchor="middle">kv_cache (seq_len rows)</text>
  <rect x="40" y="68" width="150" height="26" fill="#1d4ed8" rx="3"/>
  <rect x="190" y="68" width="40" height="26" fill="#9333ea" rx="3"/>
  <rect x="40" y="98" width="150" height="26" fill="#1d4ed8" rx="3"/>
  <rect x="190" y="98" width="40" height="26" fill="#9333ea" rx="3"/>
  <rect x="40" y="128" width="150" height="26" fill="#1d4ed8" rx="3"/>
  <rect x="190" y="128" width="40" height="26" fill="#9333ea" rx="3"/>
  <rect x="40" y="158" width="150" height="26" fill="#1d4ed8" rx="3"/>
  <rect x="190" y="158" width="40" height="26" fill="#9333ea" rx="3"/>
  <text x="115" y="86" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">c[0] (kv_lora_rank)</text>
  <text x="115" y="116" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">c[1]</text>
  <text x="115" y="146" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">...</text>
  <text x="115" y="176" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">c[seq_len-1]</text>
  <text x="210" y="86" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">k_pe</text>
  <text x="210" y="116" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">k_pe</text>
  <text x="210" y="146" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">...</text>
  <text x="210" y="176" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">k_pe</text>
  <text x="135" y="202" fill="#888" font-family="monospace" font-size="11" text-anchor="middle">no per-head K / V stored</text>

  <!-- Heads -->
  <text x="360" y="56" fill="#aaa" font-family="monospace" font-size="12" text-anchor="middle">queries</text>
  <rect x="300" y="72" width="120" height="24" fill="#0f766e" rx="3"/>
  <rect x="300" y="104" width="120" height="24" fill="#0f766e" rx="3"/>
  <rect x="300" y="136" width="120" height="24" fill="#0f766e" rx="3"/>
  <text x="360" y="89" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">q[0] = nope | pe</text>
  <text x="360" y="121" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">q[1]</text>
  <text x="360" y="153" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">q[num_heads-1]</text>

  <line x1="230" y1="90" x2="300" y2="84" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arr114)"/>
  <line x1="230" y1="120" x2="300" y2="116" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arr114)"/>
  <line x1="230" y1="170" x2="300" y2="148" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arr114)"/>

  <!-- Pipeline -->
  <text x="470" y="80" fill="#4ade80" font-family="monospace" font-size="12">per head h:</text>
  <text x="470" y="102" fill="#4ade80" font-family="monospace" font-size="12">q~ = q_nope · W_UK[h]</text>
  <text x="470" y="124" fill="#4ade80" font-family="monospace" font-size="12">s  = (q~·c + q_pe·k_pe) * scale</text>
  <text x="470" y="146" fill="#4ade80" font-family="monospace" font-size="12">a  = softmax(s)</text>
  <text x="470" y="168" fill="#4ade80" font-family="monospace" font-size="12">l  = sum_t a[t] * c[t]</text>
  <text x="470" y="190" fill="#4ade80" font-family="monospace" font-size="12">out[h] = l · W_UV[h]</text>
  <text x="470" y="216" fill="#aaa" font-family="monospace" font-size="11">scale = 1/sqrt(head_dim+rope_dim)</text>

  <rect x="40" y="232" width="640" height="48" fill="#2d2d2d" rx="6"/>
  <text x="360" y="252" fill="#ccc" font-family="monospace" font-size="11" text-anchor="middle">attention runs entirely in latent space: c[t] acts as both key and value,</text>
  <text x="360" y="270" fill="#ccc" font-family="monospace" font-size="11" text-anchor="middle">and W_UV is applied once per head after the weighted sum, not per position</text>

  <defs>
    <marker id="arr114" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
