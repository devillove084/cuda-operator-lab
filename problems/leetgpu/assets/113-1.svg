<svg width="460" height="230" viewBox="0 0 460 230" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:20px auto;">
  <rect width="460" height="230" rx="8" fill="#222"/>

  <text x="20" y="24" fill="#ccc" font-family="sans-serif" font-size="12" font-weight="bold">Each row is its own normalization group (here N=3, C=6)</text>

  <!-- Row 0 -->
  <g transform="translate(20,44)">
    <rect x="0" y="0" width="264" height="36" rx="4" fill="#1a3a5a" stroke="#4a7ab0" stroke-width="2"/>
    <rect x="6" y="6" width="38" height="24" rx="3" fill="#2a5a8a"/>
    <rect x="48" y="6" width="38" height="24" rx="3" fill="#2a5a8a"/>
    <rect x="90" y="6" width="38" height="24" rx="3" fill="#2a5a8a"/>
    <rect x="132" y="6" width="38" height="24" rx="3" fill="#2a5a8a"/>
    <rect x="174" y="6" width="38" height="24" rx="3" fill="#2a5a8a"/>
    <rect x="216" y="6" width="38" height="24" rx="3" fill="#2a5a8a"/>
    <text x="292" y="23" fill="#9cf" font-family="sans-serif" font-size="11">&#x3bc;&#8320;, &#x3c3;&#8320;&#178; over row 0</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(20,90)">
    <rect x="0" y="0" width="264" height="36" rx="4" fill="#5a3a1a" stroke="#b07a4a" stroke-width="2"/>
    <rect x="6" y="6" width="38" height="24" rx="3" fill="#8a5a2a"/>
    <rect x="48" y="6" width="38" height="24" rx="3" fill="#8a5a2a"/>
    <rect x="90" y="6" width="38" height="24" rx="3" fill="#8a5a2a"/>
    <rect x="132" y="6" width="38" height="24" rx="3" fill="#8a5a2a"/>
    <rect x="174" y="6" width="38" height="24" rx="3" fill="#8a5a2a"/>
    <rect x="216" y="6" width="38" height="24" rx="3" fill="#8a5a2a"/>
    <text x="292" y="23" fill="#fc9" font-family="sans-serif" font-size="11">&#x3bc;&#8321;, &#x3c3;&#8321;&#178; over row 1</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(20,136)">
    <rect x="0" y="0" width="264" height="36" rx="4" fill="#1a5a3a" stroke="#4ab07a" stroke-width="2"/>
    <rect x="6" y="6" width="38" height="24" rx="3" fill="#2a8a5a"/>
    <rect x="48" y="6" width="38" height="24" rx="3" fill="#2a8a5a"/>
    <rect x="90" y="6" width="38" height="24" rx="3" fill="#2a8a5a"/>
    <rect x="132" y="6" width="38" height="24" rx="3" fill="#2a8a5a"/>
    <rect x="174" y="6" width="38" height="24" rx="3" fill="#2a8a5a"/>
    <rect x="216" y="6" width="38" height="24" rx="3" fill="#2a8a5a"/>
    <text x="292" y="23" fill="#9fc" font-family="sans-serif" font-size="11">&#x3bc;&#8322;, &#x3c3;&#8322;&#178; over row 2</text>
  </g>

  <text x="230" y="196" fill="#aaa" font-family="sans-serif" font-size="11" text-anchor="middle">Statistics are reduced along the feature axis, never across rows.</text>
  <text x="230" y="214" fill="#888" font-family="sans-serif" font-size="10" text-anchor="middle">weight and bias are per-feature, shared by every row.</text>
</svg>
